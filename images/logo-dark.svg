<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 950" width="800" height="950" fill="none">
  <defs>
    <filter id="glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="shield-rim-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Outer Black Shield Contour -->
  <path d="M 400 30 C 500 55, 650 90, 750 115 C 755 240, 745 420, 680 570 C 610 730, 480 850, 400 920 C 320 850, 190 730, 120 570 C 55 420, 45 240, 50 115 C 150 90, 300 55, 400 30 Z" fill="#020617" />

  <!-- Inner Trim Contour (Silver Rim) -->
  <path d="M 400 65 C 490 88, 620 120, 715 142 C 720 250, 710 405, 650 545 C 585 695, 470 810, 400 875 C 330 810, 215 695, 150 545 C 90 405, 80 250, 85 142 C 180 120, 310 88, 400 65 Z" fill="url(#shield-rim-dark)" />

  <!-- Core Shield Interior -->
  <path d="M 400 85 C 480 106, 600 135, 685 156 C 690 255, 680 395, 625 525 C 565 665, 460 770, 400 835 C 340 770, 235 665, 175 525 C 120 395, 110 255, 115 156 C 200 135, 320 106, 400 85 Z" fill="#070b14" />

  <!-- Central Chronological Timeline Line -->
  <line x1="400" y1="180" x2="400" y2="760" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-dasharray="none" />

  <!-- Telemetry Milestone Nodes (Top to Bottom) -->
  
  <!-- Milestone Node at Y=240 (EMERGING - Red) -->
  <g class="timeline-node">
    <circle cx="400" cy="240" r="38" fill="rgba(239, 68, 68, 0.45)" />
    <circle cx="400" cy="240" r="28" fill="#070b14" stroke="#ef4444" stroke-width="6" />
    <circle cx="400" cy="240" r="16" fill="#f87171" />
    
    <!-- Telemetry Horizontal Hash Marks -->
    <line x1="330" y1="240" x2="360" y2="240" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="440" y1="240" x2="470" y2="240" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Milestone Node at Y=390 (DEVELOPING - Orange) -->
  <g class="timeline-node">
    <circle cx="400" cy="390" r="38" fill="rgba(249, 115, 22, 0.45)" />
    <circle cx="400" cy="390" r="28" fill="#070b14" stroke="#f97316" stroke-width="6" />
    <circle cx="400" cy="390" r="16" fill="#fb923c" />
    
    <!-- Telemetry Horizontal Hash Marks -->
    <line x1="330" y1="390" x2="360" y2="390" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="440" y1="390" x2="470" y2="390" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Milestone Node at Y=540 (ACKNOWLEDGED - Yellow) -->
  <g class="timeline-node">
    <circle cx="400" cy="540" r="38" fill="rgba(250, 204, 21, 0.45)" />
    <circle cx="400" cy="540" r="28" fill="#070b14" stroke="#facc15" stroke-width="6" />
    <circle cx="400" cy="540" r="16" fill="#fde047" />
    
    <!-- Telemetry Horizontal Hash Marks -->
    <line x1="330" y1="540" x2="360" y2="540" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="440" y1="540" x2="470" y2="540" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Milestone Node at Y=690 -->
  <g class="timeline-node">
    <circle cx="400" cy="690" r="38" fill="rgba(16, 185, 129, 0.45)" />
    <circle cx="400" cy="690" r="28" fill="#070b14" stroke="#10b981" stroke-width="6" />
    <circle cx="400" cy="690" r="16" fill="#34d399" />
    
    <!-- Telemetry Horizontal Hash Marks -->
    <line x1="330" y1="690" x2="360" y2="690" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="440" y1="690" x2="470" y2="690" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>