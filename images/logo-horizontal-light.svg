<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" fill="none">
  <!-- Embedded Shield Symbol -->
  <g transform="translate(10, 5) scale(0.24)">
    
  <defs>
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="shield-rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Outer Black Shield Contour -->
  <path d="M 400 30 C 500 55, 650 90, 750 115 C 755 240, 745 420, 680 570 C 610 730, 480 850, 400 920 C 320 850, 190 730, 120 570 C 55 420, 45 240, 50 115 C 150 90, 300 55, 400 30 Z" fill="#0f172a" />

  <!-- Inner Trim Contour (Silver Rim) -->
  <path d="M 400 65 C 490 88, 620 120, 715 142 C 720 250, 710 405, 650 545 C 585 695, 470 810, 400 875 C 330 810, 215 695, 150 545 C 90 405, 80 250, 85 142 C 180 120, 310 88, 400 65 Z" fill="url(#shield-rim-light)" />

  <!-- Core Shield Interior -->
  <path d="M 400 85 C 480 106, 600 135, 685 156 C 690 255, 680 395, 625 525 C 565 665, 460 770, 400 835 C 340 770, 235 665, 175 525 C 120 395, 110 255, 115 156 C 200 135, 320 106, 400 85 Z" fill="#ffffff" />

  <!-- Central Chronological Timeline Line -->
  <line x1="400" y1="180" x2="400" y2="760" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-dasharray="none" />

  <!-- Telemetry Milestone Nodes (Top to Bottom) -->
  
  <!-- Milestone Node at Y=240 (EMERGING - Red) -->
  <g class="timeline-node">
    <circle cx="400" cy="240" r="38" fill="rgba(185, 28, 28, 0.25)" />
    <circle cx="400" cy="240" r="28" fill="#ffffff" stroke="#b91c1c" stroke-width="6" />
    <circle cx="400" cy="240" r="16" fill="#dc2626" />
    
    <!-- Telemetry Horizontal Hash Marks -->
    <line x1="330" y1="240" x2="360" y2="240" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="440" y1="240" x2="470" y2="240" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Milestone Node at Y=390 (DEVELOPING - Orange) -->
  <g class="timeline-node">
    <circle cx="400" cy="390" r="38" fill="rgba(234, 88, 12, 0.25)" />
    <circle cx="400" cy="390" r="28" fill="#ffffff" stroke="#c2410c" stroke-width="6" />
    <circle cx="400" cy="390" r="16" fill="#ea580c" />
    
    <!-- Telemetry Horizontal Hash Marks -->
    <line x1="330" y1="390" x2="360" y2="390" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="440" y1="390" x2="470" y2="390" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Milestone Node at Y=540 (ACKNOWLEDGED - Yellow) -->
  <g class="timeline-node">
    <circle cx="400" cy="540" r="38" fill="rgba(161, 98, 7, 0.25)" />
    <circle cx="400" cy="540" r="28" fill="#ffffff" stroke="#a16207" stroke-width="6" />
    <circle cx="400" cy="540" r="16" fill="#d97706" />
    
    <!-- Telemetry Horizontal Hash Marks -->
    <line x1="330" y1="540" x2="360" y2="540" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="440" y1="540" x2="470" y2="540" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Milestone Node at Y=690 -->
  <g class="timeline-node">
    <circle cx="400" cy="690" r="38" fill="rgba(5, 150, 105, 0.25)" />
    <circle cx="400" cy="690" r="28" fill="#ffffff" stroke="#047857" stroke-width="6" />
    <circle cx="400" cy="690" r="16" fill="#059669" />
    
    <!-- Telemetry Horizontal Hash Marks -->
    <line x1="330" y1="690" x2="360" y2="690" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="440" y1="690" x2="470" y2="690" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  </g>

  </g>

  <!-- Wordmark & Subtitle -->
  <text x="240" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="62" fill="#0f172a" letter-spacing="-1">
    securityincident<tspan fill="#0284c7">.net</tspan>
  </text>
  <text x="245" y="160" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="600" fill="#64748b" letter-spacing="3">
    OBSERVABLE STATUS &bull; VERIFIABLE MILESTONES
  </text>
</svg>