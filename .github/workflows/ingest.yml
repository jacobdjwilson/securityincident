name: Daily Incident Ingestion & Telemetry Ingestion

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      auto_merge:
        description: 'Automatically merge changes to main if validation passes'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "telemetry-ingest"
  cancel-in-progress: false

jobs:
  ingest-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Ingest Threat Feeds & Regulatory Filings (SEC 8-K & State AG)
        run: npm run ingest

      - name: Validate Schema Compliance & Verification Standards
        run: npm test

      - name: Build Static Catalog, JSON Feed v1.1 & RSS 2.0 Feed
        run: npm run build

      - name: Verify Generated Feed Structure
        run: npm test

      - name: Check for Discovered Incidents or Updates
        id: git_status
        run: |
          if [ -n "$(git status --porcelain incidents/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "New or updated incidents detected."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new incident telemetry discovered in this cycle."
          fi

      - name: Propose Ingestion via Pull Request
        if: steps.git_status.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_DATE=$(date -u +"%Y-%m-%d")
          BRANCH_NAME="telemetry/ingest-${CURRENT_DATE}-${{ github.run_id }}"
          
          git config user.name "securityincident-bot"
          git config user.email "bot@securityincident.net"
          
          git checkout -b "$BRANCH_NAME"
          git add incidents/ sources/
          git commit -m "telemetry(ingest): update security incident index [$CURRENT_DATE]"
          git push origin "$BRANCH_NAME"
          
          PR_TITLE="telemetry(ingest): automated incident intelligence update [$CURRENT_DATE]"
          PR_BODY="### Automated Incident Telemetry Ingestion (Phase 2 Regulatory & Threat Telemetry)
          
          This automated pull request was generated by the scheduled threat feed & regulatory ingestion workflow.
          
          #### Ingested Intelligence Sources:
          * **SEC EDGAR:** Form 8-K Item 1.05 material cybersecurity incident disclosures.
          * **State Regulatory Disclosures:** Multi-state Attorney General data breach notifications (California DOJ SB-24, Washington State AG RCW 19.255).
          * **Infosec Threat Feeds:** CISA Advisories, BleepingComputer, The Record, DataBreaches.net, SecurityWeek, The Hacker News, Dark Reading, NCSC UK, HIPAA Journal.
          
          #### Verification & Compliance:
          * **Schema validation:** Passed (\`npm test\`)
          * **Build compilation:** Passed (\`npm run build\`)
          * **Open Weights Engine:** Computed deterministic confidence scores for all records
          * **Syndication Feeds:** JSON Feed v1.1 (\`dist/feed.json\`) & RSS 2.0 (\`dist/feed.xml\`)
          * **Rate-limiting:** 1200ms delay & conditional HTTP caching observed
          
          Please review the new and updated milestone files in \`incidents/\` prior to merging."
          
          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME" \
            --label "telemetry" || {
              echo "::warning::PR creation via gh pr create failed. Changes remain available on branch $BRANCH_NAME"
            }

          if [ "${{ github.event.inputs.auto_merge }}" = "true" ]; then
            echo "Attempting auto-merge on pull request..."
            gh pr merge "$BRANCH_NAME" --auto --squash || echo "::warning::Auto-merge could not be enabled automatically."
          fi
