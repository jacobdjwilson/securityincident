name: Automated Incident Telemetry Ingestion

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      reconcile_only:
        description: 'Run only downstream reconciliation & forensic audit'
        required: false
        type: boolean
        default: false
      auto_merge:
        description: 'Automatically merge changes to main if validation passes'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: "telemetry-ingest"
  cancel-in-progress: false

jobs:
  ingest-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm ci

      - name: Verify Agent Standards & Code Integrity Gate
        run: python .github/scripts/verify_code_integrity.py

      - name: Restore Telemetry Feed Cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: feed-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            feed-cache-${{ runner.os }}-

      - name: Synchronize Ingestion Branch
        id: branch_sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python .github/scripts/git_ingest_publisher.py --sync ${{ inputs.auto_merge && '--auto-merge' || '' }}

      - name: Ingest Direct Raw Feeds & Regulatory Disclosures
        if: ${{ !inputs.reconcile_only }}
        run: npm run ingest

      - name: AI Incident Telemetry Processing & Caching
        if: ${{ !inputs.reconcile_only }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
        run: python .github/scripts/ai_incident_processor.py

      - name: Downstream Reconciliation & Forensic Audit
        if: ${{ inputs.reconcile_only }}
        run: npm run reconcile

      - name: Validate Schema Compliance & Verification Standards
        run: npm test

      - name: Build Static Catalog, JSON Feed v1.1 & RSS 2.0 Feed
        run: npm run build

      - name: Verify Generated Feed Structure
        run: npm test

      - name: Check for Discovered Incidents or Updates
        id: git_status
        run: python .github/scripts/git_ingest_publisher.py --check-changes

      - name: Publish or Propose Ingestion via Pull Request
        if: steps.git_status.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >
          python .github/scripts/git_ingest_publisher.py --publish
          --mode "${{ steps.branch_sync.outputs.mode }}"
          --branch-name "${{ steps.branch_sync.outputs.branch_name }}"
          --has-open-pr "${{ steps.branch_sync.outputs.has_open_pr }}"
          --pr-number "${{ steps.branch_sync.outputs.pr_number }}"
