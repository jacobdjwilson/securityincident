name: Validate Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Incident Schema & Verification Compliance
        run: npm test

      - name: Test Static Site & RSS Feed Build
        run: npm run build

      - name: Verify Output Artifacts & RSS Compliance
        run: npm test
